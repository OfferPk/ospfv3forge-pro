<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 650" width="1000" height="650">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#060b13" />
      <stop offset="100%" stop-color="#0c1424" />
    </linearGradient>
    <linearGradient id="area0Grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="rtrGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="ipsecGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1000" height="650" fill="url(#bgGrad)" />

  <text x="500" y="45" fill="#f1f5f9" font-family="-apple-system, sans-serif" font-weight="900" font-size="22" text-anchor="middle">Zero-Trust OSPFv3 Architecture &amp; IPsec AH Peering</text>
  <text x="500" y="70" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="13" text-anchor="middle">RFC 5340 IPv6 Link-Local Adjacencies, RFC 4552 IPsec Integrity, and 100G Sized Auto-Cost</text>

  <!-- Area 0 Backbone Cloud -->
  <ellipse cx="500" cy="200" rx="380" ry="90" fill="#0f172a" stroke="#0ea5e9" stroke-width="2" stroke-dasharray="8,4" />
  <text x="500" y="135" fill="#38bdf8" font-family="sans-serif" font-weight="bold" font-size="14" text-anchor="middle">OSPFv3 Backbone Area 0.0.0.0 (High-Speed Core)</text>

  <!-- Router A (ABR 1) -->
  <rect x="200" y="150" width="200" height="100" rx="10" fill="url(#rtrGrad)" stroke="#38bdf8" stroke-width="2" />
  <text x="300" y="180" fill="#ffffff" font-family="sans-serif" font-weight="bold" font-size="15" text-anchor="middle">Core Router R1</text>
  <text x="300" y="202" fill="#38bdf8" font-family="monospace" font-size="11" text-anchor="middle">Router-ID: 10.0.0.1</text>
  <text x="300" y="222" fill="#34d399" font-family="monospace" font-size="11" text-anchor="middle">Link-Local: fe80::1</text>
  <text x="300" y="238" fill="#cbd5e1" font-family="monospace" font-size="10" text-anchor="middle">RefBW: 100 Gbps</text>

  <!-- Router B (ABR 2) -->
  <rect x="600" y="150" width="200" height="100" rx="10" fill="url(#rtrGrad)" stroke="#38bdf8" stroke-width="2" />
  <text x="700" y="180" fill="#ffffff" font-family="sans-serif" font-weight="bold" font-size="15" text-anchor="middle">Core Router R2</text>
  <text x="700" y="202" fill="#38bdf8" font-family="monospace" font-size="11" text-anchor="middle">Router-ID: 10.0.0.2</text>
  <text x="700" y="222" fill="#34d399" font-family="monospace" font-size="11" text-anchor="middle">Link-Local: fe80::2</text>
  <text x="700" y="238" fill="#cbd5e1" font-family="monospace" font-size="10" text-anchor="middle">RefBW: 100 Gbps</text>

  <!-- Core 100G Trunk with IPsec AH -->
  <line x1="400" y1="200" x2="600" y2="200" stroke="#8b5cf6" stroke-width="4" />
  <rect x="440" y="180" width="120" height="40" rx="6" fill="url(#ipsecGrad)" />
  <text x="500" y="198" fill="#ffffff" font-family="sans-serif" font-weight="bold" font-size="11" text-anchor="middle">RFC 4552 IPsec AH</text>
  <text x="500" y="213" fill="#e0e7ff" font-family="monospace" font-size="10" text-anchor="middle">SPI: 1000 | SHA-256</text>

  <!-- BFD Indicator -->
  <text x="500" y="240" fill="#fb7185" font-family="monospace" font-weight="bold" font-size="10" text-anchor="middle">BFD Active (&lt; 50ms)</text>

  <!-- Loop-Free Alternate (LFA) Bypass Path -->
  <path d="M 300 250 C 300 340, 700 340, 700 250" stroke="#10b981" stroke-width="2" stroke-dasharray="6,4" fill="none" />
  <rect x="420" y="320" width="160" height="28" rx="5" fill="#0f172a" stroke="#10b981" />
  <text x="500" y="338" fill="#34d399" font-family="sans-serif" font-weight="bold" font-size="11" text-anchor="middle">RFC 5286 LFA Repair Path</text>

  <!-- Access Subnets (Passive-Interface Default) -->
  <rect x="120" y="420" width="360" height="150" rx="10" fill="#0f172a" stroke="#334155" />
  <text x="300" y="450" fill="#f1f5f9" font-family="sans-serif" font-weight="bold" font-size="13" text-anchor="middle">Access Subnet: Vlan 100 (Client Segment)</text>
  <line x1="300" y1="250" x2="300" y2="420" stroke="#334155" stroke-width="2" />
  <rect x="150" y="470" width="300" height="40" rx="6" fill="#1e293b" stroke="#10b981" />
  <text x="300" y="495" fill="#34d399" font-family="monospace" font-weight="bold" font-size="12" text-anchor="middle">passive-interface default [ENFORCED]</text>
  <text x="300" y="530" fill="#94a3b8" font-family="sans-serif" font-size="11" text-anchor="middle">• No OSPFv3 Hellos transmitted on host ports</text>
  <text x="300" y="550" fill="#94a3b8" font-family="sans-serif" font-size="11" text-anchor="middle">• Zero risk of rogue adjacency injection</text>

  <!-- Callout Box: The 100M Reference Bandwidth Trap -->
  <rect x="520" y="420" width="360" height="150" rx="10" fill="#180e14" stroke="#f43f5e" stroke-width="1.5" />
  <text x="700" y="448" fill="#fb7185" font-family="sans-serif" font-weight="bold" font-size="13" text-anchor="middle">Auto-Cost Metric Hazard (Legacy 100M)</text>
  <text x="540" y="475" fill="#cbd5e1" font-family="sans-serif" font-size="11">• Default 100M assigns Cost 1 to 1G, 10G, 100G, 400G</text>
  <text x="540" y="495" fill="#cbd5e1" font-family="sans-serif" font-size="11">• Causes 50/50 ECMP traffic polarization on unequal links</text>
  <text x="540" y="515" fill="#cbd5e1" font-family="sans-serif" font-size="11">• Fix: auto-cost reference-bandwidth 100000</text>
  <text x="540" y="540" fill="#34d399" font-family="monospace" font-size="11">OSPFv3Forge Pro verifies cost metrics</text>
</svg>
