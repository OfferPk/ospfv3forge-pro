<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#060b13" />
      <stop offset="100%" stop-color="#0c1424" />
    </linearGradient>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#121c32" />
      <stop offset="100%" stop-color="#0c1424" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="800" fill="url(#bg)" />

  <!-- Top App Bar -->
  <rect x="30" y="24" width="1140" height="70" rx="10" fill="url(#cardGrad)" stroke="#1d2c47" stroke-width="1.5" />
  <rect x="50" y="39" width="40" height="40" rx="8" fill="url(#primaryGrad)" />
  <text x="70" y="66" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="18" text-anchor="middle">O3</text>
  <text x="105" y="56" fill="#f1f5f9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="18">OSPFv3Forge Pro</text>
  <text x="105" y="73" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12">Zero-Trust OSPF for IPv6 (RFC 5340 / RFC 5838) &amp; IPsec Authentication Studio</text>

  <!-- Badges -->
  <rect x="740" y="44" width="105" height="28" rx="6" fill="rgba(6, 182, 212, 0.15)" stroke="#06b6d4" stroke-width="1"/>
  <text x="792" y="62" fill="#38bdf8" font-family="monospace" font-weight="bold" font-size="10" text-anchor="middle">RFC 5340 V3</text>

  <rect x="855" y="44" width="115" height="28" rx="6" fill="rgba(139, 92, 246, 0.15)" stroke="#8b5cf6" stroke-width="1"/>
  <text x="912" y="62" fill="#c084fc" font-family="monospace" font-weight="bold" font-size="10" text-anchor="middle">RFC 5838 AF</text>

  <rect x="980" y="44" width="110" height="28" rx="6" fill="rgba(16, 185, 129, 0.15)" stroke="#10b981" stroke-width="1"/>
  <text x="1035" y="62" fill="#34d399" font-family="monospace" font-weight="bold" font-size="10" text-anchor="middle">RFC 4552 IPSEC</text>

  <rect x="1100" y="44" width="50" height="28" rx="6" fill="rgba(244, 63, 94, 0.15)" stroke="#f43f5e" stroke-width="1"/>
  <text x="1125" y="62" fill="#fb7185" font-family="monospace" font-weight="bold" font-size="10" text-anchor="middle">BFD</text>

  <!-- Presets Strip -->
  <rect x="30" y="110" width="230" height="34" rx="6" fill="rgba(6, 182, 212, 0.2)" stroke="#06b6d4" stroke-width="1.5" />
  <text x="145" y="132" fill="#38bdf8" font-family="-apple-system, sans-serif" font-weight="bold" font-size="12" text-anchor="middle">Zero-Trust 5G IPv6 Core (A+)</text>

  <rect x="270" y="110" width="230" height="34" rx="6" fill="#121c32" stroke="#1d2c47" stroke-width="1" />
  <text x="385" y="132" fill="#94a3b8" font-family="-apple-system, sans-serif" font-weight="bold" font-size="12" text-anchor="middle">Multi-AF Spine-Leaf (Grade A)</text>

  <rect x="510" y="110" width="220" height="34" rx="6" fill="#121c32" stroke="#1d2c47" stroke-width="1" />
  <text x="620" y="132" fill="#94a3b8" font-family="-apple-system, sans-serif" font-weight="bold" font-size="12" text-anchor="middle">Vulnerable Unhardened (F)</text>

  <!-- Left Column: Controls (Width: 420) -->
  <rect x="30" y="160" width="420" height="300" rx="10" fill="url(#cardGrad)" stroke="#1d2c47" stroke-width="1.5" />
  <text x="50" y="190" fill="#f1f5f9" font-family="-apple-system, sans-serif" font-weight="bold" font-size="14">OSPFv3 Process &amp; Area Parameters</text>
  <rect x="290" y="174" width="140" height="22" rx="4" fill="rgba(6,182,212,0.15)" />
  <text x="360" y="189" fill="#06b6d4" font-family="monospace" font-size="10" text-anchor="middle">Pure IPv6 (Instance 0)</text>

  <text x="50" y="225" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="11">Router ID (32-Bit Dotted)</text>
  <rect x="50" y="235" width="180" height="30" rx="5" fill="#09101d" stroke="#1d2c47" />
  <text x="60" y="255" fill="#f1f5f9" font-family="monospace" font-size="12">10.0.0.1</text>

  <text x="250" y="225" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="11">Process / Tag ID</text>
  <rect x="250" y="235" width="180" height="30" rx="5" fill="#09101d" stroke="#1d2c47" />
  <text x="260" y="255" fill="#f1f5f9" font-family="monospace" font-size="12">Process: 1</text>

  <text x="50" y="295" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="11">Area ID</text>
  <rect x="50" y="305" width="180" height="30" rx="5" fill="#09101d" stroke="#1d2c47" />
  <text x="60" y="325" fill="#38bdf8" font-family="monospace" font-size="12">0.0.0.0 (Backbone)</text>

  <text x="250" y="295" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="11">Reference Bandwidth</text>
  <rect x="250" y="305" width="180" height="30" rx="5" fill="#09101d" stroke="#1d2c47" />
  <text x="260" y="325" fill="#34d399" font-family="monospace" font-size="12">100,000 Mbps (100G)</text>

  <text x="50" y="365" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="11">IPsec Authentication (RFC 4552)</text>
  <rect x="50" y="375" width="180" height="30" rx="5" fill="#09101d" stroke="#1d2c47" />
  <text x="60" y="395" fill="#34d399" font-family="monospace" font-size="11">AH SHA-256 (SPI: 1000)</text>

  <text x="250" y="365" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="11">Access Ports</text>
  <rect x="250" y="375" width="180" height="30" rx="5" fill="#09101d" stroke="#1d2c47" />
  <text x="260" y="395" fill="#34d399" font-family="monospace" font-size="12">Passive Default [Active]</text>

  <!-- Left Bottom: Cost Table (Width: 420) -->
  <rect x="30" y="480" width="420" height="295" rx="10" fill="url(#cardGrad)" stroke="#1d2c47" stroke-width="1.5" />
  <text x="50" y="510" fill="#f1f5f9" font-family="-apple-system, sans-serif" font-weight="bold" font-size="14">High-Speed Interface Cost Metric Table</text>
  <rect x="320" y="495" width="110" height="22" rx="4" fill="rgba(16,185,129,0.2)" stroke="#10b981" />
  <text x="375" y="510" fill="#34d399" font-family="monospace" font-weight="bold" font-size="10" text-anchor="middle">100G Calibrated</text>

  <rect x="50" y="535" width="380" height="220" rx="6" fill="#09101d" stroke="#1d2c47" />
  <text x="65" y="560" fill="#94a3b8" font-family="monospace" font-size="11">Link Speed      Bandwidth     OSPF Cost   Status</text>
  <line x1="65" y1="570" x2="415" y2="570" stroke="#1d2c47" />
  <text x="65" y="590" fill="#f1f5f9" font-family="monospace" font-size="11">100 Mbps        100 Mbps          1000   Differentiated</text>
  <text x="65" y="615" fill="#f1f5f9" font-family="monospace" font-size="11">1 Gbps        1,000 Mbps           100   Differentiated</text>
  <text x="65" y="640" fill="#f1f5f9" font-family="monospace" font-size="11">10 Gbps      10,000 Mbps            10   Differentiated</text>
  <text x="65" y="665" fill="#f1f5f9" font-family="monospace" font-size="11">25 Gbps      25,000 Mbps             4   Differentiated</text>
  <text x="65" y="690" fill="#f1f5f9" font-family="monospace" font-size="11">40 Gbps      40,000 Mbps             2   Differentiated</text>
  <text x="65" y="715" fill="#38bdf8" font-family="monospace" font-size="11">100 Gbps    100,000 Mbps             1   Differentiated</text>
  <text x="65" y="740" fill="#34d399" font-family="monospace" font-size="10">Auto-Cost calibrated: Zero ECMP polarization risk.</text>

  <!-- Right Column: Audit Scorecard & Hex Dissector -->
  <rect x="470" y="160" width="700" height="230" rx="10" fill="url(#cardGrad)" stroke="#1d2c47" stroke-width="1.5" />
  <text x="490" y="190" fill="#f1f5f9" font-family="-apple-system, sans-serif" font-weight="bold" font-size="14">10-Point Zero-Trust OSPFv3 Security Audit</text>

  <rect x="490" y="210" width="660" height="60" rx="8" fill="rgba(16, 185, 129, 0.12)" stroke="#10b981" stroke-width="1" />
  <circle cx="530" cy="240" r="22" fill="#09101d" stroke="#10b981" stroke-width="2" />
  <text x="530" y="247" fill="#34d399" font-family="sans-serif" font-weight="900" font-size="18" text-anchor="middle">A+</text>
  <text x="570" y="235" fill="#f1f5f9" font-family="sans-serif" font-weight="bold" font-size="15">100 / 100 Points — Production-Grade Backbone</text>
  <text x="570" y="253" fill="#94a3b8" font-family="sans-serif" font-size="12">RFC 4552 IPsec AH/ESP, 100G RefBW, BFD sub-50ms, and LFA fast reroute active.</text>

  <!-- Findings snapshot -->
  <rect x="490" y="285" width="320" height="40" rx="4" fill="#09101d" stroke="#1d2c47" />
  <text x="505" y="302" fill="#34d399" font-family="sans-serif" font-weight="bold" font-size="11">✓ RFC 4552 IPsec Authentication</text>
  <text x="505" y="318" fill="#94a3b8" font-family="sans-serif" font-size="10">12/12 pts — AH SHA-256 prevents rogue LSAs</text>

  <rect x="830" y="285" width="320" height="40" rx="4" fill="#09101d" stroke="#1d2c47" />
  <text x="845" y="302" fill="#34d399" font-family="sans-serif" font-weight="bold" font-size="11">✓ Passive-Interface Default</text>
  <text x="845" y="318" fill="#94a3b8" font-family="sans-serif" font-size="10">12/12 pts — Suppressed on access VLANs</text>

  <rect x="490" y="335" width="320" height="40" rx="4" fill="#09101d" stroke="#1d2c47" />
  <text x="505" y="352" fill="#34d399" font-family="sans-serif" font-weight="bold" font-size="11">✓ Sub-Second BFD Convergence</text>
  <text x="505" y="368" fill="#94a3b8" font-family="sans-serif" font-size="10">10/10 pts — 50ms peer failure detection</text>

  <rect x="830" y="335" width="320" height="40" rx="4" fill="#09101d" stroke="#1d2c47" />
  <text x="845" y="352" fill="#34d399" font-family="sans-serif" font-weight="bold" font-size="11">✓ LFA Fast Reroute (RFC 5286)</text>
  <text x="845" y="368" fill="#94a3b8" font-family="sans-serif" font-size="10">10/10 pts — Sub-50ms precomputed backup paths</text>

  <!-- Right Bottom: Hex Wireframe & Synthesizer -->
  <rect x="470" y="410" width="700" height="365" rx="10" fill="url(#cardGrad)" stroke="#1d2c47" stroke-width="1.5" />
  <text x="490" y="435" fill="#f1f5f9" font-family="-apple-system, sans-serif" font-weight="bold" font-size="14">RFC 4552 IPsec AH + RFC 5340 OSPFv3 Hello Dissector</text>

  <!-- Hex Dump Display -->
  <rect x="490" y="450" width="660" height="110" rx="6" fill="#05080f" stroke="#1d2c47" />
  <text x="505" y="475" fill="#38bdf8" font-family="monospace" font-size="11">0000   59 04 00 00 00 00 03 e8 00 00 00 01 4a 2b 99 1f   |Y...........J+..|</text>
  <text x="505" y="495" fill="#38bdf8" font-family="monospace" font-size="11">0010   e0 33 5c 77 88 aa bb cc 03 01 00 28 0a 00 00 01   |.3\w.......(....|</text>
  <text x="505" y="515" fill="#38bdf8" font-family="monospace" font-size="11">0020   00 00 00 00 d5 7f 00 00 00 00 00 01 01 00 00 13   |................|</text>
  <text x="505" y="540" fill="#94a3b8" font-family="monospace" font-size="10">[IPsec AH: SPI 1000 | SHA-256 ICV] [OSPFv3 Hello: RID 10.0.0.1 | Area 0 | Instance 0 | Checksum 0xd57f]</text>

  <!-- Synthesizer Output -->
  <rect x="490" y="575" width="660" height="185" rx="6" fill="#05080f" stroke="#1d2c47" />
  <text x="505" y="598" fill="#10b981" font-family="monospace" font-size="11">! Cisco IOS-XE Production OSPFv3 Syntax</text>
  <text x="505" y="618" fill="#cbd5e1" font-family="monospace" font-size="11">router ospfv3 1</text>
  <text x="505" y="638" fill="#cbd5e1" font-family="monospace" font-size="11"> address-family ipv6 unicast</text>
  <text x="505" y="658" fill="#cbd5e1" font-family="monospace" font-size="11">  auto-cost reference-bandwidth 100000</text>
  <text x="505" y="678" fill="#cbd5e1" font-family="monospace" font-size="11">  passive-interface default</text>
  <text x="505" y="698" fill="#38bdf8" font-family="monospace" font-size="11">interface TenGigabitEthernet0/0/1</text>
  <text x="505" y="718" fill="#38bdf8" font-family="monospace" font-size="11"> ospfv3 1 authentication ipsec spi 1000 sha256 0123...DEF</text>
  <text x="505" y="738" fill="#38bdf8" font-family="monospace" font-size="11"> ospfv3 1 bfd</text>
</svg>
